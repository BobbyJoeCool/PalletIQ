<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PalletIQ Manual E2E Test Checklist</title>
<style>
  :root {
    --bg: #0e0e14;
    --surface: #16161e;
    --surface-alt: #1c1c26;
    --border: #2a2a38;
    --text: #e0e0e0;
    --text-muted: #9a9a9a;
    --accent: #4a6cf7;
    --accent-hover: #5a7cf9;
    --pass: #22c55e;
    --fail: #ef4444;
    --partial: #f59e0b;
    --not-tested: #6b7280;
    --tab-active: #4a6cf7;
    --tab-inactive: #2a2a38;
    --header-bg: #1a1a2e;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .header {
    background: var(--header-bg);
    padding: 20px 32px;
    border-bottom: 2px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 16px;
  }
  .header h1 {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.5px;
  }
  .header h1 span { color: var(--accent); }
  .header-meta {
    display: flex;
    gap: 12px;
    align-items: center;
    flex-wrap: wrap;
  }
  .header-meta label {
    font-size: 12px;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .header-meta input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 6px 10px;
    border-radius: 6px;
    font-size: 13px;
    width: 140px;
  }
  .header-meta input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .toolbar {
    background: var(--surface);
    padding: 10px 32px;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 10px;
    align-items: center;
    flex-wrap: wrap;
  }
  .btn {
    padding: 8px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary {
    background: var(--accent);
    color: white;
  }
  .btn-primary:hover { background: var(--accent-hover); }
  .btn-secondary {
    background: var(--border);
    color: var(--text);
  }
  .btn-secondary:hover { background: #3a3a4a; }
  .btn-danger {
    background: #7f1d1d;
    color: #fca5a5;
  }
  .btn-danger:hover { background: #991b1b; }
  .stats {
    margin-left: auto;
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    gap: 16px;
  }
  .stats .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stats .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .stats .dot-pass { background: var(--pass); }
  .stats .dot-fail { background: var(--fail); }
  .stats .dot-partial { background: var(--partial); }
  .stats .dot-not { background: var(--not-tested); }
  .layout {
    display: flex;
    height: calc(100vh - 140px);
  }
  .tab-sidebar {
    width: 220px;
    min-width: 220px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 8px 0;
  }
  .tab-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 10px 16px;
    border: none;
    background: none;
    color: var(--text-muted);
    font-size: 13px;
    cursor: pointer;
    text-align: left;
    transition: background 0.1s;
    border-left: 3px solid transparent;
  }
  .tab-btn:hover { background: var(--surface-alt); }
  .tab-btn.active {
    color: var(--text);
    background: var(--surface-alt);
    border-left-color: var(--accent);
    font-weight: 600;
  }
  .tab-btn .tab-code {
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
    color: var(--accent);
    min-width: 42px;
  }
  .tab-btn .tab-badge {
    margin-left: auto;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 8px;
    font-weight: 600;
  }
  .tab-badge-pass { background: rgba(34,197,94,0.2); color: var(--pass); }
  .tab-badge-fail { background: rgba(239,68,68,0.2); color: var(--fail); }
  .tab-badge-partial { background: rgba(245,158,11,0.2); color: var(--partial); }
  .tab-badge-none { background: rgba(107,114,128,0.15); color: var(--not-tested); }
  .content {
    flex: 1;
    overflow-y: auto;
    padding: 24px 32px;
  }
  .screen-header {
    margin-bottom: 20px;
  }
  .screen-header h2 {
    font-size: 20px;
    font-weight: 700;
  }
  .screen-header h2 .code {
    color: var(--accent);
    font-family: 'SF Mono', 'Fira Code', monospace;
    margin-right: 8px;
  }
  .screen-progress {
    margin-top: 8px;
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .screen-progress-bar {
    height: 100%;
    transition: width 0.3s;
    border-radius: 2px;
  }
  .test-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
  }
  .test-table th {
    background: var(--header-bg);
    color: white;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 10px 12px;
    text-align: left;
    position: sticky;
    top: 0;
    z-index: 1;
  }
  .test-table th:first-child { border-radius: 8px 0 0 0; width: 40px; text-align: center; }
  .test-table th:nth-child(2) { }
  .test-table th:nth-child(3) { width: 140px; text-align: center; }
  .test-table th:last-child { border-radius: 0 8px 0 0; width: 240px; }
  .test-table td {
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    vertical-align: middle;
  }
  .test-table tr:nth-child(even) td { background: var(--surface-alt); }
  .test-table tr:hover td { background: rgba(74,108,247,0.08); }
  .test-table td:first-child {
    text-align: center;
    color: var(--text-muted);
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 11px;
  }
  .status-group {
    display: flex;
    gap: 4px;
    justify-content: center;
  }
  .status-btn {
    width: 30px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text-muted);
    font-size: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.1s;
  }
  .status-btn:hover { border-color: var(--text-muted); }
  .status-btn.active-pass { background: var(--pass); color: white; border-color: var(--pass); }
  .status-btn.active-fail { background: var(--fail); color: white; border-color: var(--fail); }
  .status-btn.active-partial { background: var(--partial); color: white; border-color: var(--partial); }
  .status-btn.active-not { background: var(--not-tested); color: white; border-color: var(--not-tested); }
  .comment-input {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
  }
  .comment-input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .legend {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-muted);
    padding: 0 32px 0 0;
  }
  .legend span { display: flex; align-items: center; gap: 4px; }
  @media (max-width: 900px) {
    .tab-sidebar { width: 60px; min-width: 60px; }
    .tab-btn span:not(.tab-code) { display: none; }
    .tab-btn .tab-badge { display: none; }
    .content { padding: 16px; }
  }
</style>
</head>
<body>
<div class="header">
  <h1><span>PalletIQ</span> Manual E2E Test Checklist</h1>
  <div class="header-meta">
    <div><label>Tester</label><br><input type="text" id="tester" placeholder="Name"></div>
    <div><label>Date</label><br><input type="date" id="testDate"></div>
    <div><label>Version</label><br><input type="text" id="version" placeholder="e.g. 1.8.12"></div>
  </div>
</div>
<div class="toolbar">
  <button class="btn btn-primary" onclick="exportJSON()">Export Results (JSON)</button>
  <button class="btn btn-secondary" onclick="markAllScreen('pass')">All ✓ (this screen)</button>
  <button class="btn btn-secondary" onclick="markAllScreen('not_tested')">All — (this screen)</button>
  <button class="btn btn-danger" onclick="resetAll()">Reset All</button>
  <div class="legend">
    <span><span class="dot dot-pass"></span> Works</span>
    <span><span class="dot dot-fail"></span> Fail</span>
    <span><span class="dot dot-partial"></span> Partial</span>
    <span><span class="dot dot-not"></span> Not Tested</span>
  </div>
  <div class="stats" id="globalStats"></div>
</div>
<div class="layout">
  <div class="tab-sidebar" id="tabSidebar"></div>
  <div class="content" id="content"></div>
</div>

const STATUS_MAP = {
  'pass': { sym: '✓', cls: 'active-pass', label: 'Works' },
  'fail': { sym: '✗', cls: 'active-fail', label: "Doesn't Work" },
  'partial': { sym: '?', cls: 'active-partial', label: 'Partial' },
  'not_tested': { sym: '—', cls: 'active-not', label: 'Not Tested' }
};

let state = {};
let activeTab = 0;

function initState() {
  state = {
    tester: '',
    date: '',
    version: '',
    screens: SCREENS.map(([code, name, items]) => ({
      code, name,
      items: items.map(text => ({ text, status: 'not_tested', comment: '' }))
    }))
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem('palletiq-test-checklist');
    if (saved) {
      const parsed = JSON.parse(saved);
      if (parsed.screens && parsed.screens.length === SCREENS.length) {
        state = parsed;
        SCREENS.forEach(([code, name, items], si) => {
          if (state.screens[si].items.length !== items.length) {
            state.screens[si].items = items.map((text, ii) => {
              const old = state.screens[si].items[ii];
              return old && old.text === text ? old : { text, status: 'not_tested', comment: '' };
            });
          }
        });
        return;
      }
    }
  } catch {}
  initState();
}

function saveState() {
  state.tester = document.getElementById('tester').value;
  state.date = document.getElementById('testDate').value;
  state.version = document.getElementById('version').value;
  try { localStorage.setItem('palletiq-test-checklist', JSON.stringify(state)); } catch {}
}

function renderSidebar() {
  const el = document.getElementById('tabSidebar');
  el.innerHTML = SCREENS.map(([code, name], i) => {
    const screen = state.screens[i];
    const total = screen.items.length;
    const pass = screen.items.filter(x => x.status === 'pass').length;
    const fail = screen.items.filter(x => x.status === 'fail').length;
    let badgeCls = 'tab-badge-none', badgeText = `0/${total}`;
    if (fail > 0) { badgeCls = 'tab-badge-fail'; badgeText = `${fail} fail`; }
    else if (pass === total) { badgeCls = 'tab-badge-pass'; badgeText = 'All ✓'; }
    else if (pass > 0) { badgeCls = 'tab-badge-partial'; badgeText = `${pass}/${total}`; }
    return `<button class="tab-btn ${i === activeTab ? 'active' : ''}" onclick="switchTab(${i})">
      <span class="tab-code">${code}</span>
      <span>${name}</span>
      <span class="tab-badge ${badgeCls}">${badgeText}</span>
    </button>`;
  }).join('');
}

function renderContent() {
  const screen = state.screens[activeTab];
  const pass = screen.items.filter(x => x.status === 'pass').length;
  const fail = screen.items.filter(x => x.status === 'fail').length;
  const partial = screen.items.filter(x => x.status === 'partial').length;
  const total = screen.items.length;
  const pct = total ? Math.round((pass / total) * 100) : 0;
  const barColor = fail > 0 ? 'var(--fail)' : pass === total ? 'var(--pass)' : 'var(--accent)';

  let html = `<div class="screen-header">
    <h2><span class="code">${screen.code}</span>${screen.name}</h2>
    <div class="screen-progress"><div class="screen-progress-bar" style="width:${pct}%;background:${barColor}"></div></div>
  </div>
  <table class="test-table">
    <thead><tr><th>#</th><th>Test Item</th><th>Status</th><th>Comments</th></tr></thead>
    <tbody>`;

  screen.items.forEach((item, i) => {
    const btns = Object.entries(STATUS_MAP).map(([key, { sym, cls }]) =>
      `<button class="status-btn ${item.status === key ? cls : ''}" onclick="setStatus(${i},'${key}')" title="${STATUS_MAP[key].label}">${sym}</button>`
    ).join('');
    html += `<tr>
      <td>${i + 1}</td>
      <td>${escapeHtml(item.text)}</td>
      <td><div class="status-group">${btns}</div></td>
      <td><input class="comment-input" value="${escapeHtml(item.comment)}" onchange="setComment(${i},this.value)" placeholder="Notes..."></td>
    </tr>`;
  });

  html += '</tbody></table>';
  document.getElementById('content').innerHTML = html;
}

function renderGlobalStats() {
  let pass = 0, fail = 0, partial = 0, notTested = 0;
  state.screens.forEach(s => s.items.forEach(item => {
    if (item.status === 'pass') pass++;
    else if (item.status === 'fail') fail++;
    else if (item.status === 'partial') partial++;
    else notTested++;
  }));
  const total = pass + fail + partial + notTested;
  document.getElementById('globalStats').innerHTML =
    `<span class="stat"><span class="dot dot-pass"></span>${pass}</span>` +
    `<span class="stat"><span class="dot dot-fail"></span>${fail}</span>` +
    `<span class="stat"><span class="dot dot-partial"></span>${partial}</span>` +
    `<span class="stat"><span class="dot dot-not"></span>${notTested}</span>` +
    `<span style="color:var(--text)">${total} total</span>`;
}

function render() {
  renderSidebar();
  renderContent();
  renderGlobalStats();
}

function switchTab(i) {
  activeTab = i;
  render();
}

function setStatus(itemIdx, status) {
  state.screens[activeTab].items[itemIdx].status = status;
  saveState();
  render();
}

function setComment(itemIdx, text) {
  state.screens[activeTab].items[itemIdx].comment = text;
  saveState();
}

function markAllScreen(status) {
  state.screens[activeTab].items.forEach(item => item.status = status);
  saveState();
  render();
}

function resetAll() {
  if (!confirm('Reset ALL screens to "Not Tested"? This cannot be undone.')) return;
  state.screens.forEach(screen => screen.items.forEach(item => {
    item.status = 'not_tested';
    item.comment = '';
  }));
  document.getElementById('tester').value = '';
  document.getElementById('testDate').value = '';
  document.getElementById('version').value = '';
  saveState();
  render();
}

function exportJSON() {
  saveState();
  const output = {
    exportedAt: new Date().toISOString(),
    tester: state.tester,
    date: state.date,
    version: state.version,
    summary: {
      total: 0, pass: 0, fail: 0, partial: 0, not_tested: 0
    },
    screens: state.screens.map(screen => {
      const summary = { total: screen.items.length, pass: 0, fail: 0, partial: 0, not_tested: 0 };
      const items = screen.items.map(item => {
        summary[item.status]++;
        return { text: item.text, status: item.status, comment: item.comment };
      });
      Object.keys(summary).forEach(k => { if (k !== 'total') output.summary[k] += summary[k]; });
      output.summary.total += summary.total;
      return { code: screen.code, name: screen.name, summary, items };
    })
  };
  const json = JSON.stringify(output, null, 2);
  const filename = `palletiq-test-results-${state.version || 'draft'}-${new Date().toISOString().slice(0,10)}.json`;

  // Try the download approach first (works on http/https, usually fails on file://)
  try {
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 100);
  } catch (_) { /* fall through to clipboard */ }

  // Always also copy to clipboard as a reliable fallback
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(json).then(() => {
      alert('JSON copied to clipboard!\n\nFilename: ' + filename + '\n\nPaste into a new file to save.');
    }).catch(() => {
      showCopyModal(json, filename);
    });
  } else {
    showCopyModal(json, filename);
  }
}

function showCopyModal(json, filename) {
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9999;display:flex;align-items:center;justify-content:center';
  const box = document.createElement('div');
  box.style.cssText = 'background:#fff;border-radius:8px;padding:20px;max-width:700px;width:90%;max-height:80vh;display:flex;flex-direction:column;gap:12px';
  box.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
    <strong style="font-size:16px">Export: ${filename}</strong>
    <button onclick="this.closest('[style*=fixed]').remove()" style="border:none;background:none;font-size:20px;cursor:pointer">&times;</button>
  </div>
  <div style="font-size:13px;color:#555">Select All (Cmd+A) inside the box below, then Copy (Cmd+C). Paste into a new file.</div>
  <textarea readonly style="flex:1;min-height:300px;font-family:monospace;font-size:11px;padding:8px;border:1px solid #ccc;border-radius:4px;resize:vertical">${json.replace(/</g,'&lt;')}</textarea>`;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  const ta = box.querySelector('textarea');
  ta.focus();
  ta.select();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// Init
loadState();
document.getElementById('tester').value = state.tester || '';
document.getElementById('testDate').value = state.date || new Date().toISOString().slice(0, 10);
document.getElementById('version').value = state.version || '';
['tester', 'testDate', 'version'].forEach(id =>
  document.getElementById(id).addEventListener('input', saveState)
);
render();
</script>
